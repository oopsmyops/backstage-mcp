name: Publish plugins to npm

# Publishes the two Backstage Assistant plugins to npmjs.org as public packages
# using npm Trusted Publishing (OIDC) — no long-lived NPM_TOKEN required.
#
# Prerequisites (one-time, see README):
#   1. Each package must already exist on npmjs (do the FIRST publish manually:
#      `npm login` then `npm publish --access public` in each plugin dir).
#   2. On npmjs.com → each package → Settings → Trusted publishing, add a
#      GitHub Actions publisher: repo `oopsmyops/backstage-mcp`,
#      workflow `publish-plugins.yml` (leave environment blank).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    strategy:
      fail-fast: false
      matrix:
        package:
          - plugins/backstage-assistant
          - plugins/backstage-assistant-backend
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports OIDC (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Publish (OIDC, public, with provenance)
        run: npm publish --provenance --access public
